<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Tracker</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
<h1>Expense Tracker</h1>
<p>Simple Node.js + Express + PostgreSQL app.</p>
<form id="expenseForm">
<input id="title" placeholder="Expense title" required>
<input id="amount" type="number" min="0" step="0.01" placeholder="Amount" required>
<select id="category" required><option value="">Category</option><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Other</option></select>
<button>Add Expense</button>
</form>
<p id="message"></p><ul id="expenses"></ul>
</main>
<script src="/app.js"></script>
</body></html>
